# CI for this starter repository itself (not copied into kb-central or code repos).
name: selftest
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mcp: ["mcp>=1.9,<2", "mcp>=2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "${{ matrix.mcp }}" pytest
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: make check
      - run: make test
