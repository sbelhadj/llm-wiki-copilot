[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-mcp"
version = "0.1.0"
description = "MCP server exposing a compiled LLM Wiki (index, pages, search, link graph, review queue)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wiki-mcp = "wiki_mcp.__main__:main"

[tool.setuptools]
packages = ["wiki_mcp"]
